# SmartBooks Pro — Cloudflare Worker config
# Docs: https://developers.cloudflare.com/workers/configuration/

name            = "smartbooks-pro-api"
main            = "worker.js"
compatibility_date = "2025-01-01"

# ── Public env vars ────────────────────────────────────────────────────────────
[vars]
ALLOWED_ORIGIN  = "*"
ONBOARDING_URL  = "https://smartbooksprous.com/onboarding.html"
SITE_URL        = "https://smartbooksprous.com"

# ── Secrets — set these via the CLI, never put real values here ─────────────────
# Run once, then deploy:

# 1. Set the Stripe secret
# cd "c:\Users\Projects\Desktop\Projects\SmartBooks Pro\worker"
# npx wrangler secret put STRIPE_SECRET_KEY
# paste your sk_test_... key when prompted

# 1b. Set the WhatsApp reply auth secret (shared with the CS agent "Alex")
# npx wrangler secret put WA_REPLY_SECRET
#
# (WHATSAPP_ACCESS_TOKEN is already set in Cloudflare — no action needed)

# 2. Deploy
# npx wrangler deploy
